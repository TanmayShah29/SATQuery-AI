version: '3.8'
# docker-compose.yml — Agent E (E-2)

services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SATQUERY_ENV=production
      - BHUVAN_API_KEY=${BHUVAN_API_KEY}
      - MOSDAC_USERNAME=${MOSDAC_USERNAME}
      - MOSDAC_PASSWORD=${MOSDAC_PASSWORD}
      - HF_TOKEN=${HF_TOKEN}
      - SATQUERY_API_KEY=${SATQUERY_API_KEY}
      - FRONTEND_URL=http://localhost:80
    volumes:
      - ./data:/app/data
      - model-weights:/app/data/weights
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  model-weights:
